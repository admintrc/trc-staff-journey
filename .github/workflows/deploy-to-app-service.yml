name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build backend
      run: |
        cd backend
        npm install
        npm run build

    - name: Build frontend
      run: |
        cd frontend
        npm install --legacy-peer-deps
        npm run build

    - name: Prepare deployment package
      run: |
        # Copy backend dist to deployment folder
        mkdir -p deploy
        cp -r backend/dist/* deploy/
        cp backend/package.json deploy/
        cp backend/package-lock.json deploy/ 2>/dev/null || true

        # Copy frontend build to public folder
        mkdir -p deploy/public
        cp -r frontend/build/* deploy/public/

        # Copy .env.example if it exists
        cp .env.example deploy/ 2>/dev/null || true

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: trc-staff-journey-api
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: deploy
