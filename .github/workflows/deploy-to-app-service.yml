name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build backend
      run: |
        cd backend
        npm install
        npm run build
    
    - name: Build frontend
      run: |
        cd frontend
        npm install --legacy-peer-deps
        npm run build
    
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: trc-staff-journey-api
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: .
